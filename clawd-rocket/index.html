<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clawd and the rocket</title>
<style>
  :root { --ink: #1F1E1D; --cream: #F0EEE6; --clay: #D97757; }
  html, body { margin: 0; padding: 0; background: var(--ink); }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #14141c; }
  #gl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
  /* the iris: black outside a circle that opens on 0.0 and closes on 22.0 */
  #iris {
    position: absolute; inset: 0; background: #0a0a0c; --r: 0px;
    -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent var(--r), #000 calc(var(--r) + 2px));
            mask-image: radial-gradient(circle at 50% 50%, transparent var(--r), #000 calc(var(--r) + 2px));
  }
</style>
<script type="importmap">
{ "imports": { "three": "./assets/three/three.module.js" } }
</script>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-duration="22" class="clip">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div id="iris"></div>
  <audio id="score" src="audio/score.wav" data-start="0" data-duration="22" data-volume="1"></audio>
</div>
<script src="assets/gsap.min.js"></script>
<script src="assets/motion.js"></script>
<script type="module" src="scene.js"></script>
<script>
(function () {
  // The timeline runs on every seek. Each frame is drawn from t alone (see scene.js).
  const tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines['root'] = tl;
  const dummy = { t: 0 };
  tl.to(dummy, { t: 22, duration: 22, ease: 'none', onUpdate: function () { if (window.drawClawd) window.drawClawd(tl.time()); } }, 0);
  // the iris opens on 0.0 and closes on 21.0 to 22.0
  const iris = document.getElementById('iris');
  tl.fromTo(iris, { '--r': '0px' }, { '--r': '1500px', duration: 1.0, ease: 'expo.out', immediateRender: false }, 0);
  tl.fromTo(iris, { '--r': '1500px' }, { '--r': '0px', duration: 1.0, ease: 'power3.in', immediateRender: false }, 21.0);
})();
</script>
</body>
</html>
