<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Claude Opus 5.5 ad</title>
<script src="assets/gsap.min.js"></script>
<script src="assets/motion.js"></script>
<script>window.AD_W = 1920; window.AD_H = 1080;</script>
<style>
  @font-face { font-family: 'Instrument Serif'; src: url(assets/InstrumentSerif-Regular.woff2) format('woff2'); font-style: normal; font-display: block; }
  @font-face { font-family: 'Instrument Serif'; src: url(assets/InstrumentSerif-Italic.woff2) format('woff2'); font-style: italic; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #F0EEE6; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #F0EEE6; }
  canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .serif { font-family: 'Instrument Serif', serif; font-weight: 400; letter-spacing: -0.01em; }
  #caps { position: absolute; color: #1F1E1D; line-height: 1.05; }
  .cap { position: absolute; left: 0; width: 100%; white-space: nowrap; }
  .ch { display: inline-block; will-change: transform, opacity, filter; }
  #lock { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #lockA { font-size: 230px; line-height: 0.95; color: #1F1E1D; }
  #lockB { font-size: 140px; line-height: 1.15; color: #BF5B3A; font-style: italic; position: relative; }
  #cur { position: absolute; right: -24px; top: 18%; width: 11px; height: 70%; background: #D97757; border-radius: 3px; }
  #cta { margin-top: 56px; padding: 24px 52px; border-radius: 999px; background: #1F1E1D; color: #F0EEE6; font: 600 44px Inter, sans-serif; letter-spacing: -0.01em; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
  <canvas id="bg" class="clip" data-start="0" data-duration="30" width="1920" height="1080"></canvas>
  <canvas id="ui" class="clip" data-start="0" data-duration="30" width="1920" height="1080"></canvas>
  <div id="caps" class="clip" data-start="0" data-duration="30"></div>
  <div id="lock" class="clip serif" data-start="0" data-duration="30">
    <div id="lockA">Claude</div>
    <div id="lockB"><span id="lockBText">Opus 5.5</span><span id="cur"></span></div>
    <div id="cta">Try it at claude.ai</div>
  </div>
  <audio id="score" src="audio/score.wav" data-start="0" data-duration="30"></audio>
</div>
<script src="ad.js"></script>
</body>
</html>
