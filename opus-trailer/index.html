  :root {
    --cream: #F0EEE6;
    --ink: #1F1E1D;
    --clay: #D97757;
  }
  html, body { margin: 0; padding: 0; background: var(--ink); }
  #root { position: relative; width: 2560px; height: 1440px; overflow: hidden; background: var(--ink); }
  canvas { position: absolute; left: 0; top: 0; width: 2560px; height: 1440px; }
  .word {
    position: absolute; left: 0; right: 0; top: 0; height: 1440px; line-height: 1440px;
    text-align: center; font-family: "Instrument Serif", serif; font-size: 320px;
    color: var(--cream); opacity: 0; letter-spacing: -0.012em; white-space: nowrap;
    text-shadow: 0 0 60px rgba(31, 30, 29, 0.6);
  }
  #reveal {
    position: absolute; left: 0; right: 0; top: 0; height: 1440px; display: flex; flex-direction: column;
    justify-content: center; align-items: center;
  }
  .label {
    font-family: "Inter Embedded", sans-serif; font-weight: 500; font-size: 58px; text-transform: uppercase;
    letter-spacing: 0.9em; color: var(--clay); opacity: 0; margin-right: -0.9em; padding-bottom: 36px;
  }
  .mask { overflow: hidden; padding: 0 60px; }
  .title {
    font-family: "Instrument Serif", serif; font-size: 440px; line-height: 0.98; letter-spacing: -0.02em;
    color: var(--cream); white-space: nowrap; filter: blur(16px);
  }
  .title .dot { color: var(--clay); }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="2560" data-height="1440" data-duration="18" class="clip">
  <canvas id="field" width="2560" height="1440"></canvas>

  <div class="word" id="w-slower">Slower.</div>
  <div class="word" id="w-deeper">Deeper.</div>
  <div class="word" id="w-sharper">Sharper.</div>

  <div id="reveal">
    <div class="label" id="label">Claude</div>
    <div class="mask"><div class="title" id="title">Opus 5.5</div></div>
  </div>

  <audio id="score" src="audio/score.wav" data-start="0" data-duration="18" data-volume="1"></audio>
</div>

<script src="assets/gsap.min.js"></script>
<script src="assets/motion.js"></script>
<script>
(function () {
  const M = window.Motion;
  const W = 2560, H = 1440, CX = W / 2, CY = H / 2;
  const INK = '#1F1E1D', CREAM = '#F0EEE6', CLAY = '#D97757';
  const COLS = 64, ROWS = 36, N = COLS * ROWS;
  const GOLD = 2.39996323;

  /* ---------- seeded dots ---------- */
  const R = M.rng(20261011);
  const dots = [];
  for (let i = 0; i < N; i++) {
    const c = i % COLS, r = (i / COLS) | 0;
    const yy = 1 - (2 * (i + 0.5)) / N; // sphere: golden spiral
    const rad = Math.sqrt(1 - yy * yy);
    dots.push({
      i, c, r,
      bx: (c + 0.5) * (W / COLS),
      by: (r + 0.5) * (H / ROWS),
      z: R(),
      ph: R() * Math.PI * 2,
      clay: R() < 0.05,
      sz: 0.7 + R() * 0.6,
      dir: R() * Math.PI * 2,
      sx: rad * Math.cos(i * GOLD), sy: yy, sz3: rad * Math.sin(i * GOLD),
      stag: Math.hypot((c + 0.5) * (W / COLS) - CX, (r + 0.5) * (H / ROWS) - CY) / Math.hypot(CX, CY),
    });
  }

  /* ---------- layouts: (dot, t) -> {x, y, a} ---------- */
  const L = [];
  // 0: the grid
  L[0] = (d) => ({ x: d.bx, y: d.by });
  // 1: a rotating sphere, perspective projected
  L[1] = (d, t) => {
    const R0 = 560, th = t * 0.55 + d.i * 0.00002;
    const x = d.sx * Math.cos(th) + d.sz3 * Math.sin(th);
    const z = -d.sx * Math.sin(th) + d.sz3 * Math.cos(th);
    const f = 1700 / (1700 - z * R0);
    return { x: CX + x * R0 * f, y: CY + d.sy * R0 * f * 1.02, a: 0.5 + 0.5 * (z * 0.5 + 0.5) };
  };
  // 2: a spiral, flattened for the frame
  L[2] = (d, t) => {
    const k = d.i + 0.5;
    const rr = 1080 * Math.sqrt(k / N);
    const th = k * GOLD + t * 0.35;
    return { x: CX + Math.cos(th) * rr * 1.5, y: CY + Math.sin(th) * rr * 0.62 };
  };
  // 3: collapse to a point
  L[3] = (d) => ({ x: CX + (d.bx - CX) * 0.004, y: CY + (d.by - CY) * 0.004 });
  // 4: explosion outward on the drop
  L[4] = (d, t) => {
    const p = M.outExpo((t - 12.0) / 1.15);
    const dist = 2100 * p * (0.45 + d.z * 0.9);
    return { x: CX + Math.cos(d.dir) * dist, y: CY + Math.sin(d.dir) * dist * 0.7 };
  };
  // 5: a travelling wave field
  L[5] = (d, t) => {
    const x = d.bx;
    const y = CY + (d.r - ROWS / 2) * (H / ROWS) * 0.55 + Math.sin(x * 0.0029 + t * 1.7 + d.r * 0.3) * 150;
    return { x, y };
  };
  // 6: an orbit that speeds up through the build
  L[6] = (d, t) => {
    const acc = Math.max(0, t - 8.0);
    const th = d.ph + 0.8 * acc + 0.22 * acc * acc * 0.5 + d.z * 0.2;
    const rad = 520 + d.z * 90;
    return { x: CX + Math.cos(th) * rad * 1.55, y: CY + Math.sin(th) * rad };
  };
  // 7: the wide ring the field settles into under the title
  L[7] = (d, t) => {
    const th = d.ph + t * 0.12 + d.z * 0.4;
    const rad = 560 + d.z * 140;
    return { x: CX + Math.cos(th) * rad * 1.6, y: CY + Math.sin(th) * rad * 0.95 };
  };

  // transitions: time, duration, target layout. Each one eases in per dot (staggered from the centre).
  const SW = [
    { t: 4.0, dur: 1.1, to: 1, ease: M.inOutCubic },
    { t: 6.0, dur: 1.0, to: 2, ease: M.inOutCubic },
    { t: 8.0, dur: 0.9, to: 5, ease: M.inOutCubic },
    { t: 10.0, dur: 1.2, to: 6, ease: M.inOutCubic },
    { t: 11.88, dur: 0.12, to: 3, ease: M.anticipate },
    { t: 12.0, dur: 0.3, to: 4, ease: (p) => p },
    { t: 13.3, dur: 1.1, to: 7, ease: M.inOutCubic },
    { t: 17.0, dur: 0.9, to: 3, ease: M.inOutCubic },
  ];

  function dotState(d, t) {
    let s = L[0](d, t);
    let a = 1;
    for (const sw of SW) {
      const p = M.window(t, sw.t + d.stag * 0.32, sw.t + d.stag * 0.32 + sw.dur);
      if (p <= 0) continue;
      const w = sw.ease(p);
      const tgt = L[sw.to](d, t);
      s = { x: M.lerp(s.x, tgt.x, w), y: M.lerp(s.y, tgt.y, w), a: tgt.a == null ? a : tgt.a };
    }
    return s;
  }

  /* ---------- glow sprite ---------- */
  const glow = document.createElement('canvas');
  glow.width = glow.height = 128;
  (function () {
    const g = glow.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(217,119,87,1)');
    gr.addColorStop(0.25, 'rgba(217,119,87,0.55)');
    gr.addColorStop(1, 'rgba(217,119,87,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, 128, 128);
  })();

  const cv = document.getElementById('field');
  const ctx = cv.getContext('2d');

  function drawLine(t) {
    // the whip: a clay bar sweeping across, with motion-blur copies
    const p = M.outExpo((t - 0.92) / 0.5);
    const len = p * W * 0.62;
    if (len <= 0) return;
    const fade = M.clamp(1 - (t - 1.45) / 0.25, 0, 1);
    for (let k = 0; k < 6; k++) {
      const off = k * 26;
      ctx.globalAlpha = fade * (0.9 - k * 0.14);
      ctx.fillStyle = CLAY;
      ctx.fillRect(CX - len + off, CY - 4, len * 2 - off * 2, 8);
    }
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    // camera shake on the reveal, then a slow drift so nothing is ever still
    const shake = t > 12.5 ? Math.sin(t * 61) * 14 * Math.exp(-(t - 12.5) * 5.5) : 0;
    const shakeY = t > 12.5 ? Math.cos(t * 53) * 10 * Math.exp(-(t - 12.5) * 5.5) : 0;
    const zoom = 1 + 0.035 * Math.sin(t * 0.7) + (t > 12.0 && t < 12.6 ? 0.06 * Math.exp(-(t - 12) * 8) : 0);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = INK;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(CX + shake, CY + shakeY);
    ctx.scale(zoom, zoom);
    ctx.translate(-CX, -CY);

    // cold open: the first dot, a ripple, then the whip
    if (t < 1.5) {
      const grow = M.outBack(M.clamp(t / 0.35, 0, 1), 2.2);
      if (t < 0.5) {
        ctx.globalAlpha = 1;
        ctx.fillStyle = CLAY;
        ctx.beginPath(); ctx.arc(CX, CY, grow * 26, 0, Math.PI * 2); ctx.fill();
      } else {
        const sep = M.outExpo((t - 0.5) / 0.4) * 180;
        ctx.fillStyle = CLAY;
        ctx.beginPath(); ctx.arc(CX - sep, CY, 14, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(CX + sep, CY, 14, 0, Math.PI * 2); ctx.fill();
      }
      const rp = M.outExpo(t / 0.9) * 1400;
      ctx.globalAlpha = Math.max(0, 1 - t / 0.9) * 0.6;
      ctx.strokeStyle = CLAY;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(CX, CY, rp, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    drawLine(t);

    // the field: 2304 seeded dots, each with its own path
    if (t >= 1.9) {
      for (let k = 0; k < N; k++) {
        const d = dots[k];
        const s = dotState(d, t);
        const appear = M.outBack(M.clamp((t - 2.0 - d.stag * 0.6) / 0.55, 0, 1), 1.9);
        // beat pulse from the bar line, rising with the build
        const bar = Math.floor((t - 2.0) / 2.0) * 2.0 + 2.0;
        const pulse = t > 4 ? Math.exp(-(t - bar) * 3.2) * 0.35 : 0;
        const depth = 0.55 + d.z * 0.9;
        const rad = (2.8 + 2.6 * d.z) * d.sz * depth * (0.6 + 0.4 * appear) * (1 + pulse * 0.8);
        const alpha = Math.max(0, M.clamp(appear, 0, 1) * (0.22 + 0.5 * d.z) * (s.a == null ? 1 : M.clamp(s.a, 0.25, 1)));
        if (rad <= 0.2) continue;
        if (d.clay) {
          ctx.globalAlpha = Math.min(1, alpha * 1.6);
          ctx.drawImage(glow, s.x - rad * 5, s.y - rad * 5, rad * 10, rad * 10);
          ctx.globalAlpha = 1;
          ctx.fillStyle = CLAY;
        } else {
          ctx.globalAlpha = alpha;
          ctx.fillStyle = CREAM;
        }
        ctx.beginPath();
        ctx.arc(s.x, s.y, rad, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // accent rings on each bar from 4.0 to 12.0
    for (let b = 4.0; b < 12.0; b += 2.0) {
      const p = (t - b) / 1.0;
      if (p < 0 || p > 1) continue;
      ctx.globalAlpha = (1 - p) * 0.4;
      ctx.strokeStyle = CLAY;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(CX, CY, M.outExpo(p) * 1250, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // the drop: a cream flash
    if (t >= 12.0 && t < 12.55) {
      ctx.globalAlpha = 0.5 * Math.exp(-(t - 12.0) * 10);
      ctx.fillStyle = CREAM;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
    // reveal flash
    if (t >= 12.5 && t < 13.2) {
      ctx.globalAlpha = 0.18 * Math.exp(-(t - 12.5) * 4.5);
      ctx.fillStyle = CLAY;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }

    // vignette, so the edges stay dark and the centre reads
    const vg = ctx.createRadialGradient(CX, CY, H * 0.35, CX, CY, W * 0.62);
    vg.addColorStop(0, 'rgba(31,30,29,0)');
    vg.addColorStop(1, 'rgba(31,30,29,0.85)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  /* ---------- text ---------- */
  const tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines['root'] = tl;

  function word(id, t0) {
    const el = document.getElementById(id);
    tl.fromTo(el,
      { opacity: 0, filter: 'blur(26px)', scale: 0.9, y: 60 },
      { opacity: 1, filter: 'blur(0px)', scale: 1, y: 0, duration: 0.6, ease: 'back.out(1.5)', immediateRender: false }, t0);
    tl.to(el,
      { opacity: 0, filter: 'blur(18px)', scale: 1.05, y: -30, duration: 0.42, ease: 'power3.in' }, t0 + 1.45);
  }
  word('w-slower', 4.0);
  word('w-deeper', 6.0);
  word('w-sharper', 8.0);

  // reveal: the label first, then the wordmark rises out of its mask
  tl.fromTo('#label', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 1.2, ease: 'expo.out', immediateRender: false }, 12.45);
  tl.set('#title', { yPercent: 110 }, 0);
  tl.fromTo('#title',
    { yPercent: 110, filter: 'blur(20px)' },
    { yPercent: 0, filter: 'blur(0px)', duration: 1.1, ease: 'expo.out', immediateRender: false }, 12.52);
  tl.fromTo('#title', { scale: 1.06 }, { scale: 1, duration: 2.4, ease: 'power2.out', immediateRender: false }, 12.52);
  tl.to('#reveal', { opacity: 0, x: -220, filter: 'blur(14px)', duration: 0.6, ease: 'power3.in' }, 17.0);

  // the drawing runs on every seek, which is how frames are produced
  tl.to({ t: 0 }, {
    t: 18, duration: 18, ease: 'none',
    onUpdate: function () { draw(tl.time()); },
  }, 0);

  draw(0);
})();
</script>
</body>
